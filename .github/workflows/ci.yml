name: CI Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        id: unit_tests
        run: |
          python -m pytest -v

      - name: Send email on test failure
        if: failure() && steps.unit_tests.outcome == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: FlaskApp CI - Unit tests failed
          to: ${{ secrets.MAIL_USERNAME }}
          from: FlaskApp CI Pipeline
          body: |
            Unit tests have failed in the FlaskApp CI pipeline.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Triggered by: ${{ github.actor }}

            View workflow logs:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Build Docker image
        run: |
          docker build -t engrmusty007/flaskapp:latest .
      - name: Save Docker image
        run: |
          docker save -o flaskapp.tar engrmusty007/flaskapp:latest
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: flaskapp-image
          path: flaskapp.tar
          retention-days: 1
  publish:
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: flaskapp-image
      - name: Load Docker image
        run: |
          docker load -i flaskapp.tar
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push Docker image to Docker Hub
        run: |
          docker push engrmusty007/flaskapp:latest
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag Docker image for GHCR
        run: |
          docker tag engrmusty007/flaskapp:latest ghcr.io/engrmusty007-ai/flaskapp:latest
      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/engrmusty007-ai/flaskapp:latest
